<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poondurai Kaadai | Heritage & Tradition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="preload" href="/preloader.webm" as="video" type="video/webm" />
  </head>
  <body>
    <div id="root">
      <!-- Instant HTML/CSS preloader that renders immediately while JS bundle is loading -->
      <style>
        .initial-preloader {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #2a0603, #4a0a05, #1a0302);
        }
        .initial-preloader-video {
          width: clamp(120px, 16vw, 180px);
          height: clamp(120px, 16vw, 180px);
          object-fit: contain;
          pointer-events: none;
          user-select: none;
        }
      </style>
      <div class="initial-preloader">
        <video class="initial-preloader-video" src="/preloader.webm" autoplay muted playsinline loop></video>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
